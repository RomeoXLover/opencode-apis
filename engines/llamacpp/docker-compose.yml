version: '3.8'

services:
  llamacpp:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: opencode-llamacpp
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    command: >
      -m /models/qwen2.5-coder-7b-instruct-q4_k_m.gguf
      --host 0.0.0.0
      --port 8080
      --ctx-size 8192
      --threads 4
      --n-gpu-layers 0
