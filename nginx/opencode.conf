# Nginx Reverse Proxy Configuration for OpenCode APIs
# Supports access via raw VPS IP (http://YOUR_IP) or custom domain (http(s)://api.yourdomain.com)

# Rate limiting zone (optional Nginx-level protection)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    # Replace with your actual domain or leave _ to catch raw VPS IP
    server_name _ api.yourdomain.com;

    # Maximum request body size (large prompt contexts)
    client_max_body_size 64M;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

    # Handle CORS preflight options
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Proxy to FastAPI Gateway
    location / {
        proxy_pass http://127.0.0.1:8000;
        
        # HTTP 1.1 required for streaming chunked transfer
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITICAL FOR STREAMING: Disable Nginx proxy buffering for Server-Sent Events (SSE)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # Health check passthrough
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}
