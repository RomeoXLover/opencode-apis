version: '3.8'

services:
  # 1. OpenCode Official Package Engine
  opencode:
    image: node:20-slim
    container_name: opencode-server
    restart: unless-stopped
    ports:
      - "4096:4096"
    volumes:
      - ./engines/opencode/opencode.json:/root/.config/opencode/opencode.json:ro
      - opencode_data:/root/.opencode
    environment:
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-}
    command: >
      bash -c "
        npm install -g @opencode/cli@latest &&
        opencode serve --hostname 0.0.0.0 --port 4096
      "

  # 2. FastAPI Gateway Layer
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: opencode-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - BACKEND_TYPE=opencode
      - BACKEND_URL=http://opencode:4096
      - REQUIRE_API_KEY=false
      - API_KEYS=sk-opencode-key1,sk-opencode-key2
      - RATE_LIMIT_PER_MINUTE=120/minute
      - DEFAULT_MODEL=opencode/flint-40b-free
      - ENABLE_UPSTREAM_ROUTER=true
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY:-}
    depends_on:
      - opencode

  # 3. Nginx Reverse Proxy for VPS IP and Domain Routing
  nginx:
    image: nginx:alpine
    container_name: opencode-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/opencode.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway

volumes:
  opencode_data:
    name: opencode_server_storage
